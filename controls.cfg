# refNes controller keys.
#
# Key names are pygame key names, for example:
#   a-z, 0-9, up, down, left, right, space, return, tab, backspace,
#   left shift, right shift, left ctrl, right ctrl, left alt, right alt,
#   [0] - [9] (keypad), f1 - f12
# Give several keys for one button by separating them with commas: a = x, k
# Any button left out uses the built-in default.

[player1]
a      = x
b      = z
select = right shift
start  = return
up     = up
down   = down
left   = left
right  = right

[player2]
a      = g
b      = f
select = q
start  = e
up     = w
down   = s
left   = a
right  = d
